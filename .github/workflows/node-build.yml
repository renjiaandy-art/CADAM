name: node-build
on:
  push:
    branches: [rj-deploy]
  workflow_dispatch:
    inputs:
      supabase_url:
        description: Supabase project URL (public, baked into the client)
        required: false
        default: https://placeholder.supabase.co
      supabase_anon_key:
        description: Supabase anon key (public, baked into the client)
        required: false
        default: placeholder-anon-key
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package.json gained @ai-sdk/openai-compatible, so the lockfile is
      # refreshed here instead of `npm ci`.
      - run: npm install --no-audit --no-fund
      - name: Build (Nitro node-server)
        env:
          NITRO_PRESET: node_server
          VITE_SUPABASE_URL: ${{ inputs.supabase_url || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ inputs.supabase_anon_key || 'placeholder-anon-key' }}
        run: npm run build
      - name: Show build output layout
        run: |
          find .output -maxdepth 3 | head -40
          du -sh .output .output/server .output/public
      - uses: actions/upload-artifact@v4
        with:
          name: cadam-build
          path: .output
          include-hidden-files: true
          retention-days: 30
