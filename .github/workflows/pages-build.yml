name: pages-build
on:
  push:
    branches: [rj-deploy]
  workflow_dispatch:
    inputs:
      supabase_url:
        description: Supabase project URL (public, baked into the client)
        required: false
        default: https://placeholder.supabase.co
      supabase_anon_key:
        description: Supabase anon key (public, baked into the client)
        required: false
        default: placeholder-anon-key
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package.json gained @ai-sdk/openai-compatible, so the lockfile is
      # refreshed here instead of `npm ci`.
      - run: npm install --no-audit --no-fund
      - name: Build for Cloudflare Pages
        env:
          NITRO_PRESET: cloudflare_pages
          VITE_SUPABASE_URL: ${{ inputs.supabase_url || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ inputs.supabase_anon_key || 'placeholder-anon-key' }}
        run: npm run build
      - name: Show build output layout
        run: |
          ls -la dist .output 2>/dev/null || true
          find dist .output -maxdepth 2 2>/dev/null | head -40
          cat dist/_routes.json .output/public/_routes.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: cadam-build
          path: |
            dist
            .output
          include-hidden-files: true
          retention-days: 30
